<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MachineSense AI — Industrial Intelligence Platform</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚙️</text></svg>" />
</head>
<body>
  <div class="app">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="brand">
        <div class="logo">
          <svg viewBox="0 0 24 24" fill="none" stroke="#04121a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2v4M12 18v4M2 12h4M18 12h4M5 5l2.5 2.5M16.5 16.5 19 19M19 5l-2.5 2.5M7.5 16.5 5 19"/>
            <circle cx="12" cy="12" r="3.2"/>
          </svg>
        </div>
        <div>
          <h1>MachineSense AI</h1>
          <span>Industrial Intelligence</span>
        </div>
      </div>

      <nav class="nav" id="nav">
        <button data-view="overview" class="active">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
          Fleet Overview
        </button>
        <button data-view="machines">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 4h6v6h-6zM4 14h6v6H4zM17 14v6M14 17h6M4 4h6v6H4z"/></svg>
          Machines
        </button>
        <button data-view="twin">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 3H5a2 2 0 0 0-2 2v3M16 3h3a2 2 0 0 1 2 2v3M8 21H5a2 2 0 0 1-2-2v-3M16 21h3a2 2 0 0 0 2-2v-3"/><circle cx="12" cy="12" r="3"/></svg>
          Digital Twin
        </button>
        <button data-view="energy">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M13 2 3 14h9l-1 8 10-12h-9z"/></svg>
          Energy
        </button>
        <button data-view="alerts">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9M13.7 21a2 2 0 0 1-3.4 0"/></svg>
          Alerts <span class="badge" id="alertBadge" style="display:none">0</span>
        </button>
        <button data-view="about">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>
          About Project
        </button>
      </nav>

      <div class="sidebar-footer">
        <div class="conn"><span class="dot" id="connDot"></span><span id="connText">Connecting…</span></div>
        Industry 4.0 · IoT · Explainable AI<br/>Digital Twin · Predictive Maintenance
      </div>
    </aside>

    <!-- Main -->
    <main class="main">
      <div class="topbar">
        <div class="title">
          <h2 id="viewTitle">Fleet Overview</h2>
          <p id="viewSub">Real-time health of every connected machine</p>
        </div>
        <div class="clock"><b id="clockTime">--:--:--</b><br/><span id="clockDate"></span></div>
      </div>

      <!-- OVERVIEW -->
      <section class="view active" id="view-overview">
        <div class="grid kpis" id="kpis"></div>
        <div class="section-title">Fleet Health</div>
        <div class="grid machines-grid" id="overviewMachines"></div>
      </section>

      <!-- MACHINES -->
      <section class="view" id="view-machines">
        <div id="machineDetail"></div>
      </section>

      <!-- DIGITAL TWIN -->
      <section class="view" id="view-twin">
        <div id="twinView"></div>
      </section>

      <!-- ENERGY -->
      <section class="view" id="view-energy">
        <div id="energyView"></div>
      </section>

      <!-- ALERTS -->
      <section class="view" id="view-alerts">
        <div id="alertsView"></div>
      </section>

      <!-- ABOUT -->
      <section class="view" id="view-about">
        <div id="aboutView"></div>
      </section>
    </main>
  </div>

  <script src="charts.js"></script>
  <script src="simulator.js"></script>
  <script src="app.js"></script>
</body>
</html>
